name: Refresh Toronto 311 dashboard data

on:
  schedule:
    - cron: '0 21 10 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Toronto 311 aggregates
        run: python scripts/refresh_toronto_311.py

      - name: Commit refreshed dashboard data
        run: |
          if git diff --quiet -- public/data/toronto-311.json; then
            echo "Toronto 311 dashboard data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/toronto-311.json
          git commit -m "Refresh Toronto 311 dashboard data"
          git push